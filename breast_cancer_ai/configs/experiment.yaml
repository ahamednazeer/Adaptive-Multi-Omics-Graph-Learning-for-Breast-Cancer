# Experiment Configuration
experiment:
  name: "breast_cancer_pcr_prediction"
  version: "1.0.0"
  description: "Adaptive Multi-Omics Graph Learning for Breast Cancer pCR Prediction"
  tags: [gcn, gat, multi-omics, breast-cancer, pcr]

pipeline:
  steps:
    - name: data_inspection
      enabled: true
    - name: preprocessing
      enabled: true
    - name: splitting
      enabled: true
    - name: baseline_model
      enabled: true
    - name: feature_selection
      enabled: true
    - name: graph_construction
      enabled: true
    - name: gcn_gat_training
      enabled: true
    - name: fusion_prediction
      enabled: true
    - name: explainability
      enabled: true
    - name: validation
      enabled: true

evaluation:
  metrics: [accuracy, f1, roc_auc, precision, recall, brier_score]
  cv_folds: 5
  n_seeds: 5                  # run with multiple random seeds for stability
  bootstrap_samples: 1000
  calibration: true
  ablation: true

output:
  save_dir: "experiments/"
  save_models: true
  save_predictions: true
  save_shap: true
  save_graphs: true

logging:
  level: INFO
  format: "%(asctime)s | %(name)s | %(levelname)s | %(message)s"
