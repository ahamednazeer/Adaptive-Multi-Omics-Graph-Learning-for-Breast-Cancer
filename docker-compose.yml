services:
  # =============================================================================
  # Fast-API Backend Service (Python 3.11, PyTorch CPU, XGBoost, Multi-Omics ML)
  # =============================================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: breast-cancer-ai-backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
    volumes:
      # Database persistence
      - ./breast_cancer_ai.db:/app/breast_cancer_ai.db
      # Model experiments & checkpoint persistence
      - ./experiments:/app/experiments
      # Real clinical dataset CSV mounts (read-only)
      - ./ISPY2_merged_multomics_736.csv:/app/ISPY2_merged_multomics_736.csv:ro
      - ./GSE122630_COMPLETE_95_longitudinal_RNA.csv:/app/GSE122630_COMPLETE_95_longitudinal_RNA.csv:ro
      - ./GSE240671_COMPLETE_122_annotated_pre_post_RNA.csv:/app/GSE240671_COMPLETE_122_annotated_pre_post_RNA.csv:ro
      # Configuration overrides (read-only)
      - ./breast_cancer_ai/configs:/app/breast_cancer_ai/configs:ro
      - ./breast_cancer_ai/configs:/app/configs:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - breast-cancer-network

  # =============================================================================
  # Next.js Frontend Service (Next.js 16 Standalone, React 19, Tailwind CSS v4)
  # =============================================================================
  frontend:
    build:
      context: ./breast_cancer_ai/frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:8000
    container_name: breast-cancer-ai-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - PORT=3000
      - HOSTNAME=0.0.0.0
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - breast-cancer-network

networks:
  breast-cancer-network:
    driver: bridge
